<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ephemerides Results</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 30px;
        font-family: Arial, sans-serif;
        background-color: #f5f6f8;
        color: #333;
      }
      main {
        max-width: 1200px;
        margin: auto;
      }
      h1 {
        margin-top: 0;
        margin-bottom: 8px;
      }
      .subtitle {
        color: #666;
        margin-bottom: 25px;
      }
      #status-container {
        padding: 15px;
        margin-bottom: 25px;
        background-color: white;
        border-radius: 8px;
        border: 1px solid #ddd;
      }
      #status {
        font-weight: bold;
      }
      #results-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .prediction-card {
        background-color: white;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 20px;
        overflow-x: auto;
      }
      .prediction-card h2 {
        margin-top: 0;
        font-size: 20px;
      }
      .prediction-card h3 {
        font-size: 15px;
        font-weight: normal;
        color: #666;
        margin-top: -10px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
        white-space: nowrap;
      }
      th, td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid #eee;
      }
      th {
        background-color: #f0f2f5;
        font-weight: bold;
      }
      tr:last-child td {
        border-bottom: none;
      }
      .empty-message {
        color: #777;
        font-style: italic;
      }
      .error-message {
        color: #b42318;
      }
      .success-message {
        color: #16803c;
      }
      @media (max-width: 600px) {
        body {
          padding: 15px;
        }
        .prediction-card {
          padding: 12px;
        }
      }
    </style>
  </head>
  <body>
    <h1>Ephemerides Results</h1>
    <p class="subtitle">Topocentric occultation predictions</p>

    <div id="status-container">
      <span id="status">Connecting to the server...</span>
    </div>

    <div id="results-container">
      <!-- Prediction tables will be added here -->
    </div>
    <script src="/static/scripts/results.js"></script>
  </body>
</html>
